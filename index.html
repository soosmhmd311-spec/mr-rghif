<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#045131"><title>مستر رغيف – اللعبة الرسمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#045131;--green:#3a9a3f;--sage:#dfe3ca;--cream:#f6f5e8;--ink:#0a3023;--gold:#a8893f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--sage);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;position:relative}
.logo{display:block;height:34px}.w{filter:brightness(0) invert(1)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 12px;background:var(--deep);color:#fff;font-weight:700;font-size:13px}
.hud b{font-size:17px}.hud .logo{height:26px}
.pill{background:var(--deep);color:#fff;border-radius:20px;padding:2px 12px;font-weight:800;font-size:13px;display:inline-block}
.rail{display:flex;gap:8px;padding:10px;min-height:150px}
.tk{flex:1;min-width:0;background:var(--cream);border-radius:16px;padding:6px 4px 12px;text-align:center;position:relative;overflow:hidden;box-shadow:0 2px 0 #0a30231f;animation:in .3s ease-out}
.tk img{height:74px;display:block;margin:0 auto 2px}.tk .n{font-weight:800;font-size:12px;line-height:1.3}
.bar{position:absolute;bottom:0;right:0;height:7px;width:100%;background:var(--green)}
.tk.w2{outline:3px solid var(--deep)}.tk.w2 .bar{background:var(--gold)}
@keyframes in{from{transform:translateY(-24px);opacity:0}}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.plate{margin:0 12px;padding:10px;min-height:84px;border-radius:20px;background:var(--cream);border:3px dashed var(--deep);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center}
.plate.sh{animation:sh .35s}.hint{font-weight:700;opacity:.5;font-size:14px}
.chip{background:var(--deep);color:#fff;border-radius:16px;padding:3px 11px;font-weight:700;font-size:13px}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;align-content:start;overflow:auto}
.ing{background:var(--cream);border:2px solid #045131;border-radius:14px;padding:11px 2px;font-weight:800;font-size:13px;color:var(--deep)}
.ing:active{transform:scale(.95)}.ing.on{background:var(--deep);color:#fff}
.acts{display:flex;gap:10px;padding:6px 12px 12px}
.btn{border-radius:16px;padding:13px 20px;font-weight:800;font-size:17px;background:var(--green);color:#fff;box-shadow:0 4px 0 #045131}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.o{background:var(--cream);color:var(--deep);box-shadow:0 4px 0 #045131}.btn.s{font-size:14px;padding:8px 14px}
#go{flex:1}
.scr{position:absolute;inset:0;z-index:5;background:var(--sage);display:none;flex-direction:column;overflow:auto}
.scr.on{display:flex}.scr.dk{background:var(--deep);color:#fff;align-items:center;justify-content:center;text-align:center;gap:12px;padding:22px}
.dk .logo{height:70px}.dk p{margin:0;line-height:1.8;font-weight:500}.dk .btn{min-width:230px}.dk .btn.o{color:var(--deep)}
.top{display:flex;align-items:center;gap:10px;padding:12px;background:var(--deep);color:#fff;font-weight:800;font-size:18px}
.top button{background:none;color:#fff;font-size:22px;padding:0 6px}
.list{padding:12px;display:grid;gap:10px}.mg{grid-template-columns:repeat(2,1fr)}
.card{background:var(--cream);border-radius:16px;padding:10px;text-align:center}
.card img{height:96px}.card.lk{opacity:.55}.card .n{font-weight:800}
.row{background:var(--cream);border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.cp{background:var(--deep);color:#fff;border-radius:16px;padding:14px;text-align:center;border:3px dashed var(--sage);line-height:1.9}
.cp code{font-size:24px;font-weight:800;letter-spacing:2px;color:#fff}.cp.u{opacity:.45}
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:8px 18px;border-radius:20px;font-weight:800;z-index:9;animation:in .25s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.fl{position:absolute;left:36%;top:40%;font-weight:800;font-size:22px;color:var(--deep);background:var(--sage);border-radius:12px;padding:2px 10px;pointer-events:none;animation:up 1s forwards;z-index:8}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.say{padding:6px 12px;background:var(--cream);font-weight:800;font-size:13px;min-height:48px;line-height:1.6;border-bottom:2px solid var(--deep)}.say .pl{color:var(--deep);font-weight:500;opacity:.8}.in{border:2px solid var(--deep);border-radius:10px;padding:6px 10px;font:inherit;width:130px;background:#fff;color:var(--ink)}input[type=range]{accent-color:var(--deep);width:130px}.sc{position:relative}#cv{display:block;width:100%}.srv{position:absolute;bottom:8px;inset-inline-end:8px;padding:8px 16px;font-size:15px}#kit{flex:1;overflow:auto;padding:6px 12px 10px;display:flex;flex-direction:column;gap:8px}.oil{display:flex;gap:6px;flex-wrap:wrap}.oi{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px}.oi img{height:30px}.oi.dn{opacity:.5;text-decoration:line-through}.oi.cu{outline:3px solid var(--deep)}.oi.tx{background:var(--deep);color:#fff}.drop{min-height:74px;border-radius:20px;background:var(--cream);border:3px dashed var(--deep);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;padding:8px}.drop.sh{animation:sh .35s}.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.shelf .ing{touch-action:none;padding:8px 2px;font-size:12px}.ghost{position:fixed;z-index:50;pointer-events:none;width:84px;opacity:.9}.idle{text-align:center;font-weight:700;opacity:.6;padding:30px}.acts{display:flex;gap:10px;padding:2px 0 6px}.acts .btn{flex:1}
.say{display:flex;align-items:center;gap:10px;padding:6px 12px}#pt{width:68px;height:68px;border-radius:16px;flex:none;box-shadow:0 2px 0 #045131}#sayt{flex:1;min-width:0}#kit{gap:10px;padding:10px 12px 14px}.drop{flex:1;min-height:92px}.shelf{grid-template-columns:repeat(3,1fr);gap:8px}.shelf .ing{padding:14px 4px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}.ing .dt{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px rgba(0,0,0,.08)}.oi{padding:5px 12px;font-size:14px}.oi img{height:40px}.acts .btn{padding:16px}.chip{font-size:15px;padding:5px 14px}.scr.dk{justify-content:flex-start}.scr.dk>*:first-child{margin-top:auto}.scr.dk>*:last-child{margin-bottom:auto}.dk .btn{min-width:230px;padding:11px 20px;font-size:16px}#steps{display:flex;gap:4px;padding:6px 10px;background:var(--cream);border-bottom:2px solid #045131}#steps:empty{display:none}.sp{flex:1;text-align:center;font-weight:800;font-size:11px;padding:3px 2px;border-radius:10px;opacity:.5}.sp b{display:block;font-size:14px}.sp.on{opacity:1;background:var(--deep);color:#fff}.sp.dn{opacity:.85;color:var(--green)}.hl{background:var(--deep);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;line-height:1.5}.pay{position:absolute;left:0;right:0;bottom:0;background:var(--sage);z-index:4;padding:10px 12px;overflow:auto;display:none}.rc{background:var(--cream);border-radius:16px;padding:10px 14px;margin-bottom:8px}.rt{font-weight:800;border-bottom:2px dashed var(--deep);padding-bottom:4px;margin-bottom:4px}.rw{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:2px 0}.rw.tot{border-top:2px dashed var(--deep);margin-top:4px;padding-top:6px;font-size:18px;color:var(--deep)}.hintb{font-weight:800;margin:6px 0;text-align:center}.den{display:flex;gap:6px;justify-content:center;margin:6px 0}.den .btn{flex:1;padding:12px 0}.hb{background:var(--cream);color:var(--deep);border-radius:50%;width:26px;height:26px;font-weight:800;padding:0;flex:none}.drop{flex:none;min-height:60px;padding:6px}.shelf{grid-template-columns:repeat(4,1fr);gap:6px}.shelf .ing{padding:8px 2px;font-size:12px;gap:4px;line-height:1.25}.ing .dt{width:18px;height:18px}.hl{padding:6px 10px;font-size:12px}.oi{padding:3px 10px;font-size:13px}.oi img{height:30px}.acts .btn{padding:13px}#kit{gap:8px;padding:8px 12px 12px}.chip{font-size:13px;padding:4px 11px}.hud{font-size:12px;gap:4px;padding:8px 10px}.hud span{white-space:nowrap}.hud b{font-size:15px}.hud .logo{height:22px}#kit .acts{position:sticky;bottom:-12px;background:var(--sage);padding:6px 0 12px;z-index:2}</style></head><body><div id="app">

const steps=n=>{$('steps').innerHTML=n?[1,2,3,4].map(i=>`<div class="sp ${n===i?'on':n>i?'dn':''}"><b>${i}</b>${t('s'+i)}</div>`).join(''):''};
function stepsU(){const w=winCar();steps(w?(w.paid?4:3):g.act?(g.act.ph==='build'?1:2):0)}
function bill(c){const L=[];c.order.s.forEach(i=>{const m=M.find(z=>z.id===i);L.push([m.n,m.p])});c.order.x.forEach(i=>L.push([nmK('x:'+i),PR.x[i]]));c.order.d.forEach(i=>L.push([nmK('d:'+i),PR.d[i]]));return L}
function startPay(c){const L=bill(c),tot=L.reduce((a,b)=>a+b[1],0),cash=g.lvl>=2&&Math.random()<.5,given=cash?(tot<=10?10:tot<=50?50:100):0;c.pay={L,tot,cash,given,chg:cash?given-tot:0,tray:[]};c.paid=false;paySheet()}
function paySheet(){const e=$('pay'),c=winCar();if(!c||!c.pay){e.style.display='none';if(g)stepsU();return}const p=c.pay;e.style.display='block';e.style.top=($('kit').offsetTop||0)+'px';
 const rows=p.L.map(r=>`<div class="rw"><span>${r[0]}</span><span>${r[1]} ${t('sar')}</span></div>`).join('');let ctl;
 if(c.paid)ctl=`<div class="hintb">${t('paidOk')}</div><button class="btn" style="width:100%" onclick="deliver()">${t('serve')}</button>`;
 else if(!p.cash)ctl=`<div class="hintb">${t('card')}</div><button class="btn" style="width:100%" onclick="payOk()">${t('tapCard')}</button>`;
 else{const sum=p.tray.reduce((a,b)=>a+b,0);ctl=`<div class="hintb">${t('cashG',{g:p.given})}</div>`+(p.chg>0?`<div class="hintb">${t('chgT')}: <b>${sum}</b> ${t('sar')}</div><div class="den">${[1,2,5,10,50].map(v=>`<button class="btn o s" onclick="addC(${v})">${v}</button>`).join('')}</div><div class="acts"><button class="btn" onclick="chgOk()">${t('chgOk')}</button><button class="btn o" onclick="clrC()">${t('clear')}</button></div>`:`<button class="btn" style="width:100%" onclick="payOk()">${t('recv')}</button>`)}
 e.innerHTML=`<div class="rc"><div class="rt">${t('bill')}</div>${rows}<div class="rw tot"><span>${t('total')}</span><span>${p.tot} ${t('sar')}</span></div></div>`+ctl;stepsU()}
function payOk(){const c=winCar();if(!c||c.paid)return;c.paid=true;g.score+=15;c.pay.cash?sfx.ka():sfx.card();fl(t('paidOk'));hud();paySheet()}
function addC(v){const c=winCar();if(!c)return;c.pay.tray.push(v);sfx.pop();paySheet()}
function clrC(){const c=winCar();if(!c)return;c.pay.tray=[];sfx.tap();paySheet()}
function chgOk(){const c=winCar();if(!c)return;const s=c.pay.tray.reduce((a,b)=>a+b,0);if(s===c.pay.chg)return payOk();sfx.bad();g.streak=0;g.score=Math.max(0,g.score-5);fl(t('wrongChg'));c.pay.tray=[];hud();paySheet()}
function help(){if(g)g.pause=true;$('help').innerHTML=`<div class="top"><button onclick="if(g)g.pause=false;show(g?'':'home')">×</button>${t('helpT')}</div><div class="list">${[1,2,3,4,5,6].map(i=>`<div class="row" style="font-weight:700;line-height:1.7">${t('hp'+i)}</div>`).join('')}<button class="btn" onclick="if(g)g.pause=false;show(g?'':'home')">${t('gotit')}</button></div>`;show('help')}
function drawStaff(){const W=CW,H=CH,wy=H*.62-H*.34,wh=H*.22,wx=SL.w*W,w=winCar();cx.save();cx.beginPath();cx.rect(wx-20,wy+2,40,wh-4);cx.clip();cx.fillStyle='rgba(255,220,150,.4)';cx.fillRect(wx-20,wy+2,40,wh-4);drawFace(cx,wx,wy+wh*.5,wh*.2,STAFF,w&&w.paid?3:0,g.stk>0);cx.restore();
 if(g.bagT>0){const k=1-g.bagT/.9,bx=wx+8+k*55,by=wy+wh*.62+k*20;cx.fillStyle='#e9dcc0';cx.fillRect(bx-9,by-12,18,22);cx.fillStyle='#d6c7a4';cx.fillRect(bx-9,by-12,18,5);cx.fillStyle='#045131';cx.fillRect(bx-4,by-2,8,6)}}
function draw(){if(!g)return;drawBg();drawStaff();const gy=CH*.62+(CH-CH*.62)*.66;[...g.cars].sort((a,b)=>a.x-b.x).forEach(c=>drawCar(c,c.x*CW,gy));drawPt()}

giveCp();if(S.lang){apply();home()}else{apply();langs()}

</script></body></html>
